<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exercices T11 Consommations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mobile d'abord : une colonne, une question par écran, barre de progression collante. Charte GRETA GIP FIPAN. */
:root{
  --bg:#f3f8f8; --surface:#ffffff; --fg:#1e2426; --muted:#5e6b70; --line:#cfe6e6;
  --profond:#0b5560; --emeraude:#0e8a6c; --turq:#00a3ab; --tint:#e6f6f5;
  --ok:#1f8a4c; --ok-bg:#e7f5ec; --ko:#b8432f; --ko-bg:#fbeae6; --warn-bg:#fff4e0;
  --on-accent:#ffffff; --img-bg:#ffffff;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a1c; --surface:#132629; --fg:#e4eef0; --muted:#9db0b4; --line:#24413f;
  --profond:#7fd3d6; --emeraude:#4cc39f; --turq:#36c6cc; --tint:#183236;
  --ok:#5fd08f; --ok-bg:#16352a; --ko:#f08a74; --ko-bg:#3a1f1a; --warn-bg:#3a3020;
  --on-accent:#0d1a1c; --img-bg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1c; --surface:#132629; --fg:#e4eef0; --muted:#9db0b4; --line:#24413f;
  --profond:#7fd3d6; --emeraude:#4cc39f; --turq:#36c6cc; --tint:#183236;
  --ok:#5fd08f; --ok-bg:#16352a; --ko:#f08a74; --ko-bg:#3a1f1a; --warn-bg:#3a3020;
  --on-accent:#0d1a1c; --img-bg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.logo{background:#fff;border-radius:6px;padding:4px 6px;display:flex}
.logo img{height:34px;width:auto;display:block}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--emeraude);font-weight:700}
h1{font-size:24px;line-height:1.2;color:var(--profond);margin:4px 0 6px;text-wrap:balance}
h2{font-size:19px;line-height:1.25;color:var(--profond);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:block;font-weight:700;color:var(--profond);margin-bottom:6px}
input[type=text],input[inputmode]{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
button{font:inherit;cursor:pointer;border:none}
.btn{background:var(--profond);color:var(--on-accent);font-weight:700;padding:14px 18px;border-radius:10px;width:100%;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--profond);border:2px solid var(--line)}
.mission{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--fg)}
.mnum{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--profond);font-weight:700;display:grid;place-items:center;font-size:18px}
.mission.done .mnum{background:var(--emeraude);color:var(--on-accent)}
.mt{font-weight:700;color:var(--profond);line-height:1.25}
.mw{font-size:13px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--emeraude);white-space:nowrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.back{background:none;color:var(--profond);font-weight:700;padding:6px 0}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--emeraude);transition:width .25s}
.qtype{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q{font-size:18px;font-weight:700;line-height:1.35;margin:4px 0 12px}
.ctx{background:var(--tint);border-radius:10px;padding:12px;margin-bottom:12px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--profond)}
.opt.sel .k{background:var(--profond);border-color:var(--profond);color:var(--on-accent)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--ko);background:var(--ko-bg)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:700}
.numrow{display:flex;gap:10px;align-items:center}
.numrow input{flex:1;min-width:0}
.unit{font-weight:700;color:var(--profond);font-size:18px}
.match{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;flex-direction:column;gap:6px}
.mrow .l{font-weight:700}
select{font:inherit;width:100%;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.mrow.good select{border-color:var(--ok);background:var(--ok-bg)}
.mrow.bad select{border-color:var(--ko);background:var(--ko-bg)}
.order .pool,.order .seq{display:flex;flex-direction:column;gap:8px}
.order .seq{min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:10px;margin-bottom:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);color:var(--fg);font-size:15px;width:100%}
.chip b{color:var(--profond)}
.chip .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--profond);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.chip.good{border-color:var(--ok);background:var(--ok-bg)}
.chip.bad{border-color:var(--ko);background:var(--ko-bg)}
.link{background:none;color:var(--profond);text-decoration:underline;padding:4px 0;font-size:14px}
.media{margin-bottom:12px}
.imgbox{background:var(--img-bg);border-radius:10px;border:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch}
.imgbox img{display:block;width:100%;max-width:none;height:auto}
.imgbox.zoom img,.imgbox.zoom svg{width:170%!important}
.tblbox{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{padding:8px 8px;white-space:nowrap;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--profond);color:var(--on-accent);font-weight:700}
td:first-child{font-weight:700;color:var(--profond);text-align:left}
.cap{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 6px}
.imgbox svg{max-width:none}
.fb{border-radius:10px;padding:14px;margin-top:14px;font-size:15px}
.fb.good{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--ko-bg);border-left:5px solid var(--ko)}
.fb .v{font-weight:700;font-size:17px;margin-bottom:4px}
.fb.good .v{color:var(--ok)} .fb.bad .v{color:var(--ko)}
.hint{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.big{font-size:44px;font-weight:700;color:var(--profond);font-variant-numeric:tabular-nums;line-height:1}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--tint);color:var(--profond)}
.review{display:flex;flex-direction:column;gap:6px;font-size:14px}
.review div{display:flex;gap:8px}
.review .m{flex:none;font-weight:700}
.review .m.g{color:var(--ok)} .review .m.b{color:var(--ko)}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
</head>

/* ---------- état ---------- */
const KEY = "melec-t11-exos-v1";
let st = {prenom:"", res:{}};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") st = Object.assign(st, s); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
/* ---------- Envoi des résultats au professeur (Google Sheets) ----------
   ▼ Coller entre les guillemets l'adresse de l'application Web (elle finit par /exec) */
const ADRESSE_TABLEAU = "COLLER_ICI_L_ADRESSE_EXEC";
const CLE_TABLEAU = "melec-greta";
const SEANCE = "T11";
const QKEY = KEY + "-envoi";
function fileEnvoi(){ try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch(e){ return []; } }
function majEnvoi(t){ const el = document.getElementById("envoi"); if (el) el.textContent = t; }
function viderFile(){
  if (ADRESSE_TABLEAU.indexOf("http") !== 0) return;
  const q = fileEnvoi(); if (!q.length) return;
  const d = q[0];
  fetch(ADRESSE_TABLEAU, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(d)})
    .then(() => { const r = fileEnvoi().filter(x => x.id !== d.id); try { localStorage.setItem(QKEY, JSON.stringify(r)); } catch(e){}
                  majEnvoi("✓ Résultat transmis au professeur."); if (r.length) viderFile(); })
    .catch(() => majEnvoi("Résultat non transmis (pas de réseau) : il sera renvoyé à la prochaine ouverture de la page."));
}
function envoyer(m, s, n){
  if (ADRESSE_TABLEAU.indexOf("http") !== 0) return;
  const r = st.res[m.id];
  const d = {id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), cle: CLE_TABLEAU, seance: SEANCE,
             prenom: st.prenom, mission: MISSIONS.indexOf(m) + 1, titre: m.titre, score: s, sur: n, essai: r ? r.essais : 1};
  const q = fileEnvoi(); q.push(d); try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){}
  majEnvoi("Envoi du résultat…"); viderFile();
}
window.addEventListener("load", viderFile);

let cur = null; // {mi, qi, answers:[], picked}
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const total = MISSIONS.reduce((n,m)=>n+m.items.length,0);
const typeLabel = {qcm:"Choix unique", vf:"Vrai ou faux", num:"Calcul", match:"Association", order:"Remise en ordre"};

function header(){
  return `<header class="top"><div class="logo"><img src="${IMG.logo}" alt="GRETA GIP FIPAN"></div>
  <div><div class="eyebrow">Bac Pro MELEC · Technologie</div><div class="muted" style="font-size:13px">Séance T11 · présentiel</div></div></header>`;
}

/* ---------- accueil ---------- */
function home(){
  cur = null;
  const done = MISSIONS.filter(m => st.res[m.id]).length;
  let pts = 0; MISSIONS.forEach(m => { if (st.res[m.id]) pts += st.res[m.id].s; });
  app.innerHTML = header() + `
  <h1>Mesure et suivi des consommations</h1>
  <p class="muted">${total} exercices en 4 missions. Faites chaque mission quand le professeur l'annonce. La correction s'affiche après chaque réponse.</p>
  <div class="panel" style="margin-block:14px">
    <label class="f" for="prenom">Votre prénom</label>
    <input type="text" id="prenom" autocomplete="given-name" maxlength="30" value="${esc(st.prenom)}" placeholder="ex. Karim">
  </div>
  <div class="stack" id="list"></div>
  ${done ? `<div class="actions"><button class="btn sec" id="bilan">Voir mon bilan (${pts} / ${total})</button></div>` : ""}
  <footer>GRETA GIP FIPAN · Bac Pro MELEC · T11 Mesure et suivi des consommations</footer>`;
  const list = document.getElementById("list");
  MISSIONS.forEach((m, i) => {
    const r = st.res[m.id];
    const b = document.createElement("button");
    b.className = "mission" + (r ? " done" : "");
    b.innerHTML = `<span class="mnum">${i+1}</span><span><span class="mt">${esc(m.titre)}</span><br><span class="mw">${esc(m.quand)} · ${m.items.length} exercices</span></span>
      <span class="score">${r ? r.s + " / " + m.items.length : "›"}</span>`;
    b.onclick = () => { if (!needName()) start(i); };
    list.appendChild(b);
  });
  const inp = document.getElementById("prenom");
  inp.addEventListener("input", () => { st.prenom = inp.value.trim(); save(); inp.style.borderColor = ""; });
  const bb = document.getElementById("bilan"); if (bb) bb.onclick = bilan;
}
function needName(){
  if (st.prenom) return false;
  const inp = document.getElementById("prenom"); inp.style.borderColor = "var(--ko)"; inp.focus();
  inp.placeholder = "Indiquez votre prénom pour commencer"; return true;
}

/* ---------- mission ---------- */
function start(mi){ cur = {mi, qi:0, answers:[]}; question(); window.scrollTo(0,0); }

function mediaHTML(k){ return `<div class="media">${MEDIA[k]}</div>`; }

function question(){
  const m = MISSIONS[cur.mi], it = m.items[cur.qi], n = m.items.length;
  cur.picked = null; cur.validated = false;
  app.innerHTML = `<div class="bar"><div class="barrow"><button class="back" id="quit">‹ Missions</button>
    <span>Mission ${cur.mi+1} · ${cur.qi+1} / ${n}</span></div>
    <div class="track"><div class="fill" style="width:${(cur.qi)/n*100}%"></div></div></div>
    <div class="panel"><div class="qtype">${typeLabel[it.t]}</div>
    ${it.media ? mediaHTML(it.media) : ""}
    <div class="q">${esc(it.q)}</div>
    <div id="zone"></div>
    ${it.hint ? `<button class="link" id="hintb">Afficher l'aide</button><div class="hint" id="hint" hidden>${esc(it.hint)}</div>` : ""}
    <div id="fb"></div>
    <div class="actions"><button class="btn" id="go" disabled>Valider</button></div></div>`;
  document.getElementById("quit").onclick = home;
  const z = document.getElementById("zoom"); if (z) z.onclick = () => { const b = document.getElementById("imgbox"); b.classList.toggle("zoom"); z.textContent = b.classList.contains("zoom") ? "Réduire l'image" : "Agrandir l'image"; };
  const hb = document.getElementById("hintb"); if (hb) hb.onclick = () => { document.getElementById("hint").hidden = false; hb.hidden = true; cur.hinted = true; };
  const go = document.getElementById("go");
  const zone = document.getElementById("zone");
  const ready = v => { go.disabled = !v; };
  RENDER[it.t](it, zone, ready);
  go.onclick = () => {
    if (!cur.validated){ const ok = CHECK[it.t](it, zone); cur.validated = true; cur.answers.push(ok); feedback(it, ok); go.textContent = cur.qi + 1 < n ? "Exercice suivant" : "Voir le résultat de la mission"; go.disabled = false; go.focus(); }
    else { cur.qi++; if (cur.qi < n) { question(); window.scrollTo(0,0); } else finish(); }
  };
}

function feedback(it, ok){
  let extra = "";
  if (!ok && it.t === "num" && it.trap && cur.numVal !== null && Math.abs(cur.numVal - it.trap.val) < 1e-9) extra = `<p><b>${esc(it.trap.msg)}</b></p>`;
  if (!ok && it.t === "num") extra += `<p>Réponse attendue : <b>${String(it.ans).replace(".",",")} ${it.unit}</b>.</p>`;
  if (!ok && it.t === "vf") extra += `<p>Réponse attendue : <b>${it.ok ? "Vrai" : "Faux"}</b>.</p>`;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"good":"bad"}" role="status"><div class="v">${ok?"Bonne réponse":"Pas tout à fait"}</div>${extra}<p style="margin:0">${esc(it.fb)}</p></div>`;
  const h = document.getElementById("hintb"); if (h) h.hidden = true;
  document.getElementById("fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
}

const RENDER = {
  qcm(it, z, ready){
    const order = shuffle(it.opts.map((o,i)=>i)); cur.order = order;
    z.innerHTML = `<div class="opts">${order.map((i,k)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[k]}</span><span>${esc(it.opts[i])}</span></button>`).join("")}</div>`;
    z.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (cur.validated) return; z.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); cur.picked = +b.dataset.i; ready(true); });
  },
  vf(it, z, ready){
    z.innerHTML = `<div class="vf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div>`;
    z.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (cur.validated) return; z.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); cur.picked = b.dataset.v === "1"; ready(true); });
  },
  num(it, z, ready){
    z.innerHTML = `<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" placeholder="Votre résultat" aria-label="Votre résultat en ${it.unit}"><span class="unit">${it.unit}</span></div>`;
    const inp = z.querySelector("#num");
    inp.addEventListener("input", () => ready(parseNum(inp.value) !== null));
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !document.getElementById("go").disabled) document.getElementById("go").click(); });
  },
  match(it, z, ready){
    const rights = shuffle(it.pairs.map(p=>p[1]));
    z.innerHTML = `<div class="match">${it.pairs.map((p,i)=>`<div class="mrow" data-i="${i}"><span class="l">${esc(p[0])}</span>
      <select id="m${cur.mi}-${cur.qi}-${i}"><option value="">Choisir…</option>${rights.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
    const sels = [...z.querySelectorAll("select")];
    sels.forEach(s => s.onchange = () => ready(sels.every(x => x.value)));
  },
  order(it, z, ready){
    cur.seq = []; const pool = shuffle(it.items.map((x,i)=>i));
    const draw = () => {
      z.innerHTML = `<p class="muted" style="margin-bottom:6px">Votre ordre :</p>
      <div class="order"><div class="seq">${cur.seq.length ? cur.seq.map((i,k)=>`<div class="chip" data-i="${i}"><span class="n">${k+1}</span><span><b>${esc(it.items[i][0])}</b> · ${esc(it.items[i][1])}</span></div>`).join("") : `<span class="muted">Touchez une étape ci-dessous.</span>`}</div>
      <div class="pool">${pool.filter(i=>!cur.seq.includes(i)).map(i=>`<button class="chip" data-i="${i}"><span><b>${esc(it.items[i][0])}</b> · ${esc(it.items[i][1])}</span></button>`).join("")}</div>
      ${cur.seq.length && !cur.validated ? `<button class="link" id="reset">Recommencer l'ordre</button>` : ""}</div>`;
      z.querySelectorAll(".pool .chip").forEach(b => b.onclick = () => { if (cur.validated) return; cur.seq.push(+b.dataset.i); draw(); ready(cur.seq.length === it.items.length); });
      const r = z.querySelector("#reset"); if (r) r.onclick = () => { cur.seq = []; draw(); ready(false); };
    };
    cur.redrawOrder = draw; draw();
  },
};

function parseNum(v){ v = String(v).trim().replace(/\s/g,"").replace(",","."); if (!/^-?\d*\.?\d+$/.test(v)) return null; return parseFloat(v); }

const CHECK = {
  qcm(it, z){ const ok = cur.picked === it.ok;
    z.querySelectorAll(".opt").forEach(b => { const i = +b.dataset.i; if (i === it.ok) b.classList.add("good"); else if (i === cur.picked) b.classList.add("bad"); b.disabled = true; });
    return ok; },
  vf(it, z){ const ok = cur.picked === it.ok;
    z.querySelectorAll(".opt").forEach(b => { const v = b.dataset.v === "1"; if (v === it.ok) b.classList.add("good"); else if (v === cur.picked) b.classList.add("bad"); b.disabled = true; });
    return ok; },
  num(it, z){ const inp = z.querySelector("#num"); const v = parseNum(inp.value); cur.numVal = v; inp.disabled = true;
    const ok = v !== null && Math.abs(v - it.ans) <= it.tol + 1e-9; inp.style.borderColor = ok ? "var(--ok)" : "var(--ko)"; return ok; },
  match(it, z){ let all = true;
    z.querySelectorAll(".mrow").forEach(r => { const i = +r.dataset.i, s = r.querySelector("select"); const g = s.value === it.pairs[i][1]; r.classList.add(g ? "good" : "bad"); all = all && g; s.disabled = true;
      if (!g) { const p = document.createElement("span"); p.className = "muted"; p.textContent = "Attendu : " + it.pairs[i][1]; r.appendChild(p); } });
    return all; },
  order(it, z){ const ok = cur.seq.every((v,k)=>v===k); cur.redrawOrder();
    z.querySelectorAll(".seq .chip").forEach((c,k) => c.classList.add(+c.dataset.i === k ? "good" : "bad"));
    if (!ok) { const p = document.createElement("p"); p.className = "muted"; p.style.marginTop = "8px"; p.textContent = "Ordre attendu : " + it.items.map(x=>x[0]).join(" → "); z.appendChild(p); }
    return ok; },
};

function finish(){
  const m = MISSIONS[cur.mi], s = cur.answers.filter(Boolean).length, n = m.items.length;
  const prev = st.res[m.id];
  st.res[m.id] = {s, n, essais: (prev ? prev.essais : 0) + 1, premier: prev ? prev.premier : s}; save(); setTimeout(() => envoyer(m, s, n), 0);
  const next = cur.mi + 1 < MISSIONS.length ? cur.mi + 1 : null;
  app.innerHTML = header() + `<div class="eyebrow">Mission ${cur.mi+1} terminée</div><h1>${esc(m.titre)}</h1>
  <div class="panel stack" style="margin-top:10px"><div><span class="big">${s} / ${n}</span></div>
  <p class="muted" style="margin:0">${s === n ? "Parfait, " + esc(st.prenom) + " !" : s >= n*0.7 ? "Bien, " + esc(st.prenom) + ". Relisez les corrections des exercices manqués." : esc(st.prenom) + ", reprenez cette partie du cours, puis refaites la mission."}</p>
  <div class="review">${m.items.map((it,i)=>`<div><span class="m ${cur.answers[i]?"g":"b"}">${cur.answers[i]?"✓":"✗"}</span><span>${esc(it.q.length > 90 ? it.q.slice(0,88) + "…" : it.q)}</span></div>`).join("")}</div>${ADRESSE_TABLEAU.indexOf("http") === 0 ? '<p id="envoi" class="muted" style="margin:0;font-size:.85em"></p>' : ""}</div>
  <div class="actions">
    ${next !== null ? `<button class="btn sec" id="redo">Refaire cette mission</button><button class="btn" id="home">Retour aux missions</button>` :
      `<button class="btn" id="bil">Voir mon bilan</button><button class="btn sec" id="redo">Refaire cette mission</button>`}
  </div>`;
  document.getElementById("redo").onclick = () => start(cur.mi);
  const h = document.getElementById("home"); if (h) h.onclick = home;
  const b = document.getElementById("bil"); if (b) b.onclick = bilan;
  window.scrollTo(0,0);
}

function bilan(){
  let s = 0, n = 0;
  const rows = MISSIONS.map((m,i) => { const r = st.res[m.id]; if (r) { s += r.s; } n += m.items.length;
    return `<div class="rec"><span>${i+1}. ${esc(m.titre)}${r && r.essais > 1 ? ` <span class="badge">${r.essais} essais</span>` : ""}</span><span class="score">${r ? r.s + " / " + m.items.length : "à faire"}</span></div>`; }).join("");
  app.innerHTML = header() + `<div class="eyebrow">Bilan</div><h1>${esc(st.prenom || "Mon bilan")}</h1>
  <div class="panel" style="margin-top:10px"><span class="big">${s} / ${n}</span><p class="muted" style="margin:6px 0 10px">Score de la dernière tentative de chaque mission.</p>${rows}</div>
  <div class="panel" style="margin-top:12px;background:var(--tint);border-color:var(--tint)"><h2>Évaluation de fin de séance</h2>
  <p style="margin:0">Le professeur vous indique comment la passer : page d'évaluation (QR code), quiz Moodle ou version papier. Répondez seul et sans document.</p></div>
  <div class="actions"><button class="btn" id="home">Retour aux missions</button></div>`;
  document.getElementById("home").onclick = home;
  window.scrollTo(0,0);
}

home();
</script>
